services:
  - type: web
    runtime: docker
    name: chore-tracker-api-pdmoura-demo
    plan: free
    region: virginia
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 3000
      - key: CORS_ORIGINS
        sync: false
